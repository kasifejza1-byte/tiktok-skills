<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#06204a}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script>
const W=1080,H=1920,c=document.getElementById('c'),x=c.getContext('2d');
const WHITE='#FFFFFF',YEL='#FFD93D',PINK='#FF5FA2',CYAN='#3FE0FF',GREEN='#7CF07C',RED='#FF4D5E',INK='#14093a',COPPER='#E08A4B';
const KCOLS=[YEL,PINK,CYAN,GREEN];
let WORDS=[],T=0;
const cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const p=(t,a,b)=>cl((t-a)/(b-a));
const eo=v=>1-Math.pow(1-v,3);
const eio=v=>v<.5?4*v*v*v:1-Math.pow(-2*v+2,3)/2;
const back=v=>{const s=1.70158;v=v-1;return v*v*((s+1)*v+s)+1};
const lerp=(a,b,v)=>a+(b-a)*v;
function hash(i){const s=Math.sin(i*127.1)*43758.5453;return s-Math.floor(s);}
function rr(X,Y,w,h,r){x.beginPath();x.moveTo(X+r,Y);x.arcTo(X+w,Y,X+w,Y+h,r);x.arcTo(X+w,Y+h,X,Y+h,r);x.arcTo(X,Y+h,X,Y,r);x.arcTo(X,Y,X+w,Y,r);x.closePath();}
function circ(X,Y,r,fill,stroke,lw=8){x.beginPath();x.arc(X,Y,r,0,Math.PI*2);if(fill){x.fillStyle=fill;x.fill();}if(stroke){x.strokeStyle=stroke;x.lineWidth=lw;x.stroke();}}
function line(a,b,cc,d,col=WHITE,lw=8){x.strokeStyle=col;x.lineWidth=lw;x.lineCap='round';x.beginPath();x.moveTo(a,b);x.lineTo(cc,d);x.stroke();}
function pop(t,at,dur=.35){return {a:p(t,at,at+.1),sc:Math.max(0.01,back(p(t,at,at+dur)))};}

// ---------- images ----------
const IMG={},SPR={},BLR={};
function loadImgs(){return Promise.all([1,2,3].map(i=>new Promise(r=>{const im=new Image();im.onload=()=>{IMG[i]=im;
  const s=document.createElement('canvas');s.width=im.width;s.height=im.height;const g=s.getContext('2d');g.drawImage(im,0,0);
  g.globalCompositeOperation='destination-in';const m=g.createLinearGradient(0,0,0,im.height);
  m.addColorStop(0,'rgba(0,0,0,0)');m.addColorStop(.13,'rgba(0,0,0,1)');m.addColorStop(.87,'rgba(0,0,0,1)');m.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=m;g.fillRect(0,0,im.width,im.height);SPR[i]=s;
  const b=document.createElement('canvas');b.width=im.width/4;b.height=im.height/4;const bg=b.getContext('2d');bg.filter='blur(6px) brightness(0.7) saturate(1.3)';bg.drawImage(im,-8,-8,b.width+16,b.height+16);BLR[i]=b;r();};im.src='img/'+i+'.png';})));}
// camera: source focus (fx,fy) placed at screen (540,CY)
const BASE=2.2,CY=880;let CAM={i:1,fx:640,fy:360,z:1,ox:0,oy:0,rot:0};
function S(px,py){const s=BASE*CAM.z;return [540+(px-CAM.fx)*s+CAM.ox,CY+(py-CAM.fy)*s+CAM.oy];}
function shot(i,fx,fy,z,ox=0,oy=0,rot=0){
  const im=IMG[i],s=BASE*z;
  fx=cl(fx,540/s,im.width-540/s); // never show image edge horizontally
  CAM={i,fx,fy,z,ox,oy,rot};
  // blurred cover
  const cs=Math.max(H/im.height,W/im.width)*1.15;const bw=im.width*cs,bh=im.height*cs;
  x.drawImage(BLR[i],540-(fx/im.width)*bw*0.9-bw*0.05+ox*0.3,(H-bh)/2+oy*0.3,bw,bh);
  x.save();x.translate(540+ox,CY+oy);x.rotate(rot);x.drawImage(SPR[i],-fx*s,-fy*s,im.width*s,im.height*s);x.restore();
}

// ---------- fx ----------
function comic(s,X,Y,size,col,o={}){x.save();x.translate(X,Y);x.rotate(o.rot||0);x.scale(o.sc||1,o.sc||1);x.globalAlpha*=(o.a??1);x.font=`900 ${size}px Inter`;x.textAlign='center';x.textBaseline='middle';
  let sz=size;while(x.measureText(s).width>(o.max||W-100)){sz-=3;x.font=`900 ${sz}px Inter`;}
  x.lineJoin='round';x.lineWidth=sz*0.28;x.strokeStyle=INK;x.strokeText(s,0,sz*0.07);x.strokeText(s,0,0);x.fillStyle=col;x.fillText(s,0,0);x.restore();}
function burst(X,Y,r,col,sc=1,rot=0){x.save();x.translate(X,Y);x.rotate(rot);x.scale(sc,sc);x.beginPath();for(let k=0;k<24;k++){const a=k*Math.PI/12,r2=k%2?r*.62:r*(0.95+0.1*hash(k));x.lineTo(Math.cos(a)*r2,Math.sin(a)*r2);}x.closePath();x.fillStyle=col;x.fill();x.strokeStyle=WHITE;x.lineWidth=10;x.stroke();x.restore();}
function pill(s,X,Y,size,bg,fg=INK,o={}){x.save();x.translate(X,Y);x.scale(o.sc||1,o.sc||1);x.globalAlpha*=(o.a??1);x.font=`900 ${size}px Inter`;const tw=x.measureText(s).width,pw=tw+size*1.1,ph=size*1.7;
  rr(-pw/2,-ph/2+6,pw,ph,ph/2);x.fillStyle=INK;x.fill();rr(-pw/2,-ph/2,pw,ph,ph/2);x.fillStyle=bg;x.fill();x.strokeStyle=WHITE;x.lineWidth=6;x.stroke();
  x.fillStyle=fg;x.textAlign='center';x.textBaseline='middle';x.fillText(s,0,2);x.restore();}
function heartPath(X,Y,r){x.beginPath();x.moveTo(X,Y+r*0.9);x.bezierCurveTo(X-r*1.6,Y-r*0.1,X-r*0.9,Y-r*1.3,X,Y-r*0.45);x.bezierCurveTo(X+r*0.9,Y-r*1.3,X+r*1.6,Y-r*0.1,X,Y+r*0.9);x.closePath();}
function heart(X,Y,r,col=RED){heartPath(X,Y+5,r);x.fillStyle=INK;x.fill();heartPath(X,Y,r);x.fillStyle=col;x.fill();x.strokeStyle=WHITE;x.lineWidth=6;x.stroke();circ(X-r*0.45,Y-r*0.4,r*0.16,'rgba(255,255,255,0.8)');}
function beat(t,f=1.25){const ph=(t*f)%1;return 1+0.18*Math.exp(-ph*14)+0.1*Math.exp(-Math.max(0,ph-0.18)*14)*(ph>0.18);}
function glow(X,Y,r,col,a=1){x.save();x.globalAlpha*=a;const g=x.createRadialGradient(X,Y,0,X,Y,r);g.addColorStop(0,col);g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.globalCompositeOperation='lighter';x.fillRect(X-r,Y-r,2*r,2*r);x.restore();}
function ring(X,Y,r,col,lw=8,a=1){x.save();x.globalAlpha*=a;circ(X,Y,r,null,col,lw);x.restore();}
function pulseRings(X,Y,r,t,col){for(let k=0;k<2;k++){const ph=((t*1.25)+k*0.5)%1;ring(X,Y,r*(1+ph*1.2),col,7,(1-ph)*0.9);}}
function sparkle(X,Y,r,col=WHITE,a=1){x.save();x.globalAlpha*=a;x.translate(X,Y);x.beginPath();for(let k=0;k<8;k++){const an=k*Math.PI/4,rr2=k%2?r*0.22:r;x.lineTo(Math.cos(an)*rr2,Math.sin(an)*rr2);}x.closePath();x.fillStyle=col;x.fill();x.restore();}
function sparkles(t,n,X,Y,R,col=WHITE,seed=0){for(let i=0;i<n;i++){const ph=(t*0.9+hash(i+seed))%1;const a=hash(i*3+seed)*Math.PI*2,d=R*(0.3+0.7*hash(i*7+seed));
  sparkle(X+Math.cos(a)*d,Y+Math.sin(a)*d-ph*60,14+16*hash(i+seed*2),col,Math.sin(ph*Math.PI));}}
function bubbles(t){for(let i=0;i<22;i++){const sp=60+90*hash(i+3),y=H+100-((t*sp+hash(i)*H*1.3)%(H+200)),xx=hash(i+11)*W+Math.sin(t*1.5+i)*20,r=6+18*hash(i+5);
  x.save();x.globalAlpha=0.55;circ(xx,y,r,'rgba(255,255,255,0.08)','rgba(255,255,255,0.8)',3);circ(xx-r*.35,y-r*.35,r*.22,'rgba(255,255,255,0.9)');x.restore();}}
function confetti(X,Y,t0,n=70,spread=900){const dt=T-t0;if(dt<0||dt>3)return;for(let i=0;i<n;i++){const a=hash(i)*Math.PI*2,v=300+hash(i+7)*spread;
  const px=X+Math.cos(a)*v*dt,py=Y+Math.sin(a)*v*dt*0.8+600*dt*dt;x.save();x.translate(px,py);x.rotate(dt*8+i);x.globalAlpha=cl(1-dt/3);x.fillStyle=KCOLS[i%4];x.fillRect(-11,-7,22,14);x.restore();}}
function flash(t,t0,col='255,255,255',d=.3,a0=.85){const k=p(t,t0,t0+d);if(k>0&&k<1){x.fillStyle=`rgba(${col},${a0*(1-k)})`;x.fillRect(0,0,W,H);}}
function vignette(){const g=x.createRadialGradient(W/2,H/2,500,W/2,H/2,1250);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,10,40,0.55)');x.fillStyle=g;x.fillRect(0,0,W,H);}
function speedLines(t,a){x.save();x.globalAlpha=a;for(let i=0;i<26;i++){const xx=hash(i)*W,len=200+300*hash(i+4),y=((t*2200+hash(i+9)*H*2)%(H+600))-300;line(xx,y,xx,y+len,'rgba(255,255,255,0.7)',4+5*hash(i+2));}x.restore();}
function coin(X,Y,r,col,sym,label,o={}){x.save();x.translate(X,Y);x.scale(o.sc||1,o.sc||1);x.globalAlpha*=(o.a??1);
  circ(0,6,r,INK);circ(0,0,r,col,WHITE,8);circ(0,0,r*0.78,null,'rgba(255,255,255,0.45)',5);
  x.font=`900 ${r*0.8}px Inter`;x.fillStyle=WHITE;x.textAlign='center';x.textBaseline='middle';x.lineWidth=10;x.strokeStyle=INK;x.lineJoin='round';x.strokeText(sym,0,4);x.fillText(sym,0,4);
  comic(label,0,r+56,52,WHITE);
  if(o.cross){const k=o.cross;x.lineCap='round';x.strokeStyle=RED;x.lineWidth=22;x.beginPath();x.moveTo(-r,-r);x.lineTo(-r+2*r*cl(k*2),-r+2*r*cl(k*2));x.stroke();if(k>.5){x.beginPath();x.moveTo(r,-r);x.lineTo(r-2*r*cl(k*2-1),-r+2*r*cl(k*2-1));x.stroke();}}
  if(o.check){const k=o.check;circ(r*0.8,-r*0.8,42,GREEN,WHITE,6);x.strokeStyle=INK;x.lineWidth=12;x.beginPath();x.moveTo(r*0.8-18,-r*0.8);x.lineTo(r*0.8-4,-r*0.8+14*k);if(k>.5)x.lineTo(r*0.8+20,-r*0.8-16);x.stroke();}
  x.restore();}
function ecg(X,Y,w,h,t,flatFrom,col){x.save();rr(X-w/2,Y-h/2+8,w,h,30);x.fillStyle=INK;x.fill();rr(X-w/2,Y-h/2,w,h,30);x.fillStyle='rgba(10,20,50,0.88)';x.fill();x.strokeStyle=WHITE;x.lineWidth=6;x.stroke();
  x.beginPath();x.rect(X-w/2+20,Y-h/2,w-40,h);x.clip();x.strokeStyle=col;x.lineWidth=8;x.lineJoin='round';x.beginPath();
  const n=140;for(let k=0;k<=n;k++){const u=k/n,px=X-w/2+20+u*(w-40);const tt=t-(1-u)*2.2;let v=0;
    if(tt<flatFrom){const ph=(tt*1.6)%1;v=ph<.08?-Math.sin(ph/.08*Math.PI)*0.9:ph<.14?Math.sin((ph-.08)/.06*Math.PI)*0.35:ph<.3?-Math.sin((ph-.14)/.16*Math.PI)*0.12:0;}
    const py=Y+v*h*0.42;k?x.lineTo(px,py):x.moveTo(px,py);}x.stroke();
  const hx=X-w/2+w-20;glow(hx,Y,50,col,0.6);x.restore();}
function qmark(X,Y,s,col,rot){x.save();x.translate(X,Y);x.rotate(rot);circ(0,6,s,INK);circ(0,0,s,col,WHITE,7);x.font=`900 ${s*1.2}px Inter`;x.fillStyle=WHITE;x.textAlign='center';x.textBaseline='middle';x.lineWidth=10;x.strokeStyle=INK;x.lineJoin='round';x.strokeText('?',0,4);x.fillText('?',0,4);x.restore();}
function speech(X,Y,w,h,s,size,o={}){x.save();x.translate(X,Y);x.scale(o.sc||1,o.sc||1);x.globalAlpha*=(o.a??1);
  const path=()=>{rr(-w/2,-h/2,w,h,48);x.moveTo(-w*0.2,h/2-2);x.lineTo(-w*0.32,h/2+70);x.lineTo(-w*0.05,h/2-2);};
  x.translate(0,8);path();x.fillStyle=INK;x.fill();x.translate(0,-8);path();x.fillStyle=WHITE;x.fill();x.strokeStyle=INK;x.lineWidth=8;x.stroke();
  x.font=`900 ${size}px Inter`;x.fillStyle=INK;x.textAlign='center';x.textBaseline='middle';s.split('\n').forEach((l,i,a)=>x.fillText(l,0,(i-(a.length-1)/2)*size*1.15));x.restore();}

// ---------- captions (word by word, kid style) ----------
function caption(t){let cur=null,idx=0;WORDS.forEach((w,i)=>{if(t>=w.s-0.02&&t<w.e){cur=w;idx=i;}});
  if(!cur)return;const k=p(t,cur.s-0.02,cur.s+0.18);const sc=0.6+0.4*back(k);
  x.save();x.translate(W/2,1610);x.rotate((idx%2?1:-1)*0.035);x.scale(sc,sc);let size=110;x.font=`900 ${size}px Inter`;x.textAlign='center';x.textBaseline='middle';
  while(x.measureText(cur.w).width>W-120){size-=4;x.font=`900 ${size}px Inter`;}
  x.lineJoin='round';x.lineWidth=28;x.strokeStyle=INK;x.strokeText(cur.w,0,9);x.strokeText(cur.w,0,0);x.fillStyle=KCOLS[idx%4];x.fillText(cur.w,0,0);x.restore();}

// ---------- scenes ----------
function sHook(t){ // 0 - 4.85
  const z=lerp(1.0,1.22,eio(p(t,0,4.8)));shot(1,636,lerp(360,300,eio(p(t,0,4.8))),z,0,Math.sin(t*1.6)*10);
  const H3=[[545,237],[636,212],[727,238]];
  H3.forEach(([hx,hy],i)=>{const at=1.72+i*0.17;const [X,Y]=S(hx,hy);const b=beat(t+i*0.2);
    glow(X,Y,150*b,'rgba(255,90,110,0.7)',p(t,at,at+.2));
    if(t>at){const q=pop(t,at,.4);x.save();x.translate(X,Y-120);x.scale(q.sc,q.sc);circ(0,4,44,INK);circ(0,0,44,YEL,WHITE,6);x.font='900 54px Inter';x.fillStyle=INK;x.textAlign='center';x.textBaseline='middle';x.fillText(String(i+1),0,3);x.restore();}});
  const q=pop(t,0.1,.45);comic('3 HERZEN?!',W/2,250,150,YEL,{sc:q.sc,a:q.a,rot:-0.05+Math.sin(t*3)*0.02});
  if(t>2.89){const q2=pop(t,2.89,.4);pill('DER OKTOPUS',W/2,420,60,PINK,WHITE,{sc:q2.sc,a:q2.a});}
  sparkles(t,10,W/2,560,380,'#FFF6B0',1);
}
function sHearts(t){ // 4.85 - 11.0
  const z=lerp(1.12,1.35,eio(p(t,4.85,11)));shot(2,606,lerp(380,400,p(t,4.85,11)),z,0,Math.sin(t*1.4)*8);
  const small=[[533,393,'KIEMEN-HERZ',-1],[680,403,'KIEMEN-HERZ',1]];
  small.forEach(([hx,hy,l,sd],i)=>{const at=5.42+i*0.35;if(t<at)return;const [X,Y]=S(hx,hy);const k=p(t,at,at+.3);
    glow(X,Y,110*beat(t),'rgba(255,170,120,0.8)',k);pulseRings(X,Y,50,t,'#FFD0A0');
    const q=pop(t,at,.4);const ly=Y+(i?-1:1)*0+260;x.save();x.globalAlpha=k;line(X,Y+40,X+sd*40,ly-50,WHITE,6);x.restore();pill(l,X+sd*70,ly,46,YEL,INK,{sc:q.sc,a:q.a});});
  // flowing dots to gills
  if(t>6.2){for(let i=0;i<10;i++){const ph=(t*0.8+i/10)%1;const sd=i%2?1:-1;const [X,Y]=S(606+sd*lerp(70,105,ph),lerp(410,330,ph));x.save();x.globalAlpha=Math.sin(ph*Math.PI)*p(t,6.2,6.6);circ(X,Y,10,CYAN,WHITE,3);x.restore();}}
  if(t>8.25){const [X,Y]=S(606,418);const k=p(t,8.25,8.6);const b=beat(t,1.3);glow(X,Y,230*b,'rgba(255,80,120,0.85)',k);pulseRings(X,Y,85,t,PINK);
    const q=pop(t,8.5,.45);pill('KÖRPER-HERZ',W/2,430,64,PINK,WHITE,{sc:q.sc,a:q.a});
    if(t>9.3){const q2=pop(t,9.3,.4);x.save();x.globalAlpha=q2.a;heart(150,1320,48*b*q2.sc);heart(930,1320,48*b*q2.sc);x.restore();}}
  comic('3 HERZEN',W/2,215,92,YEL,{rot:-0.03});
}
function sBlue(t){ // 11.0 - 17.1
  const k=eio(p(t,12.98,14.0));const z=lerp(1.0,1.45,k);const sh=t<12.9?Math.sin(t*45)*7*p(t,11.2,11.5):0;
  shot(3,lerp(620,745,k),lerp(340,265,k),lerp(1.05,1,1-p(t,11,12.9))*z,sh,Math.sin(t*1.5)*8,sh*0.002);
  if(t<12.95){const q=pop(t,11.25,.4);comic('JETZT WIRD\'S',W/2,230,100,WHITE,{sc:q.sc,a:q.a,rot:-0.04});const q2=pop(t,12.0,.4);comic('VERRÜCKT!',W/2,360,140,PINK,{sc:q2.sc,a:q2.a,rot:0.04+Math.sin(t*20)*0.02});}
  flash(t,14.1,'60,200,255',.5,.7);
  if(t>13.4){const [X,Y]=S(745,255);glow(X,Y,330,'rgba(60,180,255,0.9)',p(t,13.4,14.1));sparkles(t,14,X,Y,300,'#BFF4FF',4);}
  if(t>14.1&&t<17.2){const q=pop(t,14.1,.45);burst(W/2,300,190,CYAN,q.sc,t*0.6);comic('BLAU!',W/2,300,140,WHITE,{sc:q.sc,rot:-0.06});}
  const yb=1350;
  if(t>15.9){const q=pop(t,15.9,.45);coin(300,yb,95,COPPER,'Cu','KUPFER',{sc:q.sc,a:q.a,check:p(t,16.2,16.5)});}
  if(t>16.55){const q=pop(t,16.55,.45);coin(780,yb,95,'#7E8798','Fe','EISEN',{sc:q.sc,a:q.a,cross:p(t,16.75,17.1)});}
}
function sStop(t){ // 17.1 - 21.6
  const swim=p(t,18.4,18.7)*(1-p(t,21.3,21.6));const oy=Math.sin(t*9)*40*swim;
  shot(2,606,lerp(360,410,p(t,17.1,21.5)),lerp(1.1,1.35,eio(p(t,17.1,21.5))),Math.sin(t*5)*30*swim,oy,Math.sin(t*9)*0.04*swim);
  speedLines(t,0.5*swim);
  const flat=20.35;const [X,Y]=S(606,418);
  if(t<flat){const b=beat(t,1.5);glow(X,Y,200*b,'rgba(255,80,120,0.8)',1);pulseRings(X,Y,80,t,PINK);}
  else{glow(X,Y,180,'rgba(120,140,200,0.6)',1);const q=pop(t,flat,.4);x.save();x.translate(X,Y);x.scale(q.sc,q.sc);circ(0,6,90,INK);circ(0,0,90,RED,WHITE,8);x.fillStyle=WHITE;rr(-38,-42,26,84,8);x.fill();rr(12,-42,26,84,8);x.fill();x.restore();}
  if(t<18.35){const q=pop(t,17.3,.4);comic('NOCH KRASSER:',W/2,250,120,YEL,{sc:q.sc,a:q.a,rot:-0.04});}
  else{const q=pop(t,18.4,.35);pill('BEIM SCHWIMMEN …',W/2,230,58,CYAN,INK,{sc:q.sc,a:q.a});
    if(t>flat){const q2=pop(t,flat,.4);comic('HERZ-PAUSE!',W/2,380,130,RED,{sc:q2.sc,rot:0.04+Math.sin(t*18)*0.015});}}
  ecg(W/2,1290,820,190,t,flat+0.15,t<flat?GREEN:RED);
  flash(t,flat,'255,60,80',.35,.5);
}
function sCrawl(t){ // 21.6 - 24.25
  const k=p(t,21.6,24.25);const step=Math.sin(t*7);
  shot(1,lerp(560,720,k),lerp(470,520,eio(k)),1.25,0,Math.abs(step)*-26,step*0.03);
  // footprints in sand: little dots trail
  for(let i=0;i<7;i++){const at=21.9+i*0.3;if(t<at)continue;const [X,Y]=S(480+i*45,640+(i%2)*14);x.save();x.globalAlpha=0.8*p(t,at,at+.15);circ(X,Y,16,'rgba(255,240,200,0.9)',INK,4);x.restore();}
  const q=pop(t,22.1,.45);comic('LIEBER',W/2,230,110,WHITE,{sc:q.sc,a:q.a,rot:-0.04});const q2=pop(t,22.4,.45);comic('KRABBELN!',W/2,365,150,GREEN,{sc:q2.sc,a:q2.a,rot:0.03+step*0.02});
  const [X,Y]=S(640,400);x.save();x.globalAlpha=q2.a;heart(X+250,Y-120,40*beat(t,1.3));x.restore();
}
function sTaste(t){ // 24.25 - 27.9
